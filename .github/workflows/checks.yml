name: Host checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Host regression tests
        run: python3 -m unittest discover -s docker -p 'test_*.py'
      - name: Python and shell syntax
        run: |
          python3 -m py_compile scripts/populate-config-bundles.py docker/*.py
          for script in scripts/*.sh docker/*.sh; do bash -n "$script"; done
          for script in docker/px4-rc.*; do sh -n "$script"; done
      - name: LF line endings
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          patterns = ('*.sh', '*.py', '*.lua', '*.mavlink', '*.simulator', '*.yml',
                      '*.yaml', '*.list', '*.parm', '*.waypoints', '*.json',
                      'Dockerfile', 'Dockerfile.*')
          report = subprocess.check_output(['git', 'ls-files', '--eol', '--', *patterns]).decode()
          bad = []
          for line in report.splitlines():
              fields = line.split('\t')
              if len(fields) != 2:
                  continue
              state, name = fields
              if 'i/crlf' in state or 'w/crlf' in state:
                  bad.append(f'{name}: {state.strip()}')
          for entry in bad:
              print(entry)
          if bad:
              sys.exit('CRLF detected; .gitattributes keeps these files at LF.')
          print('All checked files use LF line endings.')
          PY
      - name: Checked-in JSON bundles
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z', 'configs']).decode().split('\0')
          for name in paths:
              if name.endswith('.json'):
                  json.loads(Path(name).read_text())
                  print(name)
          PY
      - name: Compose configuration only
        run: |
          docker compose -f compose.sitl.yml -f docker/compose.qualification.yml config --quiet
          JSBSIM_MODELS_DIR=/tmp/config-only-models JSBSIM_MODEL=HeavyQuad docker compose -f compose.jsbsim.yml -f compose.jsbsim-models.yml config --quiet
          JSBSIM_MODELS_DIR=/tmp/config-only-models JSBSIM_MODEL=HeavyQuad docker compose -f compose.jsbsim-split.yml -f compose.jsbsim-split-models.yml config --quiet
          JSBSIM_MODELS_DIR=/tmp/config-only-models docker compose -f compose.px4-jsbsim.yml -f compose.px4-jsbsim-models.yml config --quiet
          JSBSIM_MODELS_DIR=/tmp/config-only-models docker compose -f compose.px4-jsbsim-split.yml -f compose.px4-jsbsim-split-models.yml config --quiet
          python3 - <<'PY'
          import json
          import os
          import subprocess
          for filename in ('compose.sitl.yml', 'compose.px4-sih.yml', 'compose.jsbsim.yml', 'compose.jsbsim-split.yml',
                           'compose.px4-jsbsim.yml', 'compose.px4-jsbsim-split.yml'):
              for address in ('127.0.0.1', '0.0.0.0'):
                  env = dict(os.environ, PX4_SIH_IMAGE='px4-sih:config-only', SITL_BIND_ADDRESS=address)
                  data = json.loads(subprocess.check_output(
                      ['docker', 'compose', '-f', filename, 'config', '--format', 'json'], env=env))
                  ports = [p for service in data['services'].values() for p in service.get('ports', [])]
                  assert ports and all(p['host_ip'] == address for p in ports), (filename, address, ports)
                  print(filename, address)
          PY
